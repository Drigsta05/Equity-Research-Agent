[project]
name = "equity-research-agent"
version = "0.1.0"
description = "3-Agent Equity Research Pipeline: Research → Model → Write"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42.0",
    "jsonschema>=4.20.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
]

[project.scripts]
equity-research = "agents.coordinator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
